<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quince Decay Time-lapse</title>
    <style>
      /* Base styles */
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        line-height: 1.6;
      }

      .container {
        max-width: min(1200px, 90vw);
        margin: 0 auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .image-container {
        width: 100%;
        position: relative;
        aspect-ratio: 16/9;
        background: #f0f0f0;
        margin: 20px 0;
      }

      .image-display {
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 1;
        transition: opacity 0.3s ease-in-out;
      }

      .image-display.loading {
        opacity: 0.5;
      }

      /* Error message styling */
      .error-message {
        display: none;
        background-color: #fee;
        border: 1px solid #fcc;
        color: #c00;
        padding: 1rem;
        margin: 1rem 0;
        border-radius: 4px;
        width: 100%;
        text-align: center;
      }

      .connection-status {
        position: fixed;
        top: 1rem;
        right: 1rem;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        font-size: 0.875rem;
      }

      .connection-status.connected {
        background-color: #e8f5e9;
        color: #2e7d32;
      }

      .connection-status.disconnected {
        background-color: #ffebee;
        color: #c62828;
      }

      /* Responsive design */
      @media (max-width: 768px) {
        .container {
          padding: 10px;
        }

        h1 {
          font-size: 1.5rem;
          text-align: center;
        }

        .image-container {
          aspect-ratio: 4/3;
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: 5px;
        }

        h1 {
          font-size: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Quince Decay Time-lapse</h1>
      <div id="errorMessage" class="error-message"></div>
      <div class="image-container">
        <img
          id="currentImage"
          class="image-display"
          alt="Quince decay time-lapse"
        />
      </div>
    </div>
    <div id="connectionStatus" class="connection-status"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      // Create Socket.IO connection with options
      const socket = io({
        withCredentials: true,
        transports: ['websocket', 'polling'],
        reconnectionAttempts: 5,
        reconnectionDelay: 1000
      });

      const img = document.getElementById('currentImage');
      const errorMessage = document.getElementById('errorMessage');
      const connectionStatus = document.getElementById('connectionStatus');
      let reconnectAttempts = 0;

      // Image loading handler
      function handleImageLoad(url) {
        img.classList.add('loading');
        
        const newImage = new Image();
        newImage.onload = () => {
          img.src = url;
          img.classList.remove('loading');
        };
        newImage.onerror = () => {
          showError('Failed to load image. Please try refreshing the page.');
          img.classList.remove('loading');
        };
        newImage.src = url;
      }

      // Error handling functions
      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
      }

      function hideError() {
        errorMessage.style.display = 'none';
      }

      function updateConnectionStatus(status, message) {
        connectionStatus.textContent = message;
        connectionStatus.className = `connection-status ${status}`;
      }

      // Socket event handlers
      socket.on('connect', () => {
        console.log('Connected to server');
        hideError();
        updateConnectionStatus('connected', 'Connected');
        reconnectAttempts = 0;
      });

      socket.on('disconnect', () => {
        console.log('Disconnected from server');
        updateConnectionStatus('disconnected', 'Disconnected');
      });

      socket.on('connect_error', (error) => {
        console.error('Connection error:', error);
        reconnectAttempts++;
        updateConnectionStatus('disconnected', 'Connection error');
        
        if (reconnectAttempts >= 5) {
          showError('Unable to connect to server. Please check your internet connection and refresh the page.');
        } else {
          showError('Connection lost. Attempting to reconnect...');
        }
      });

      socket.on('reconnect', (attemptNumber) => {
        console.log('Reconnected to server after', attemptNumber, 'attempts');
        hideError();
        updateConnectionStatus('connected', 'Connected');
      });

      socket.on('reconnect_failed', () => {
        showError('Failed to reconnect. Please refresh the page.');
        updateConnectionStatus('disconnected', 'Connection failed');
      });

      // Image update handler
      socket.on('imageUpdate', (data) => {
        hideError();
        handleImageLoad(data.url);
      });

      // Handle page visibility changes
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && !socket.connected) {
          socket.connect();
        }
      });
    </script>
  </body>
</html>
