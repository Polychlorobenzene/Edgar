<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quince Decay Time-lapse</title>
    <style>
      .container {
        max-width: 1200px;
        margin: 0 auto;
        text-align: center;
      }
      .image-display {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Quince Decay Time-lapse</h1>
      <img
        id="currentImage"
        class="image-display"
        alt="Quince decay time-lapse"
      />
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="text/javascript">
      // Create Socket.IO connection
      const socket = io();

      // Listen for image updates from server
      socket.on("imageUpdate", (data) => {
        const img = document.getElementById("currentImage");
        img.src = data.url;
      });
    </script>
  </body>
</html>
